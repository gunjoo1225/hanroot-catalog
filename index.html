<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HANROOT 2026 COLLECTION</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #c9a96e;
      --gold-dim: rgba(201,169,110,0.4);
      --bg: #08080d;
    }

    body {
      background: var(--bg); color: #fff;
      font-family: 'Helvetica Neue', 'Apple SD Gothic Neo', Arial, sans-serif;
      height: 100dvh; overflow: hidden;
      user-select: none; -webkit-user-select: none;
    }

    /* ── Header ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      height: 52px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 28px;
      background: rgba(8,8,13,0.52);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .logo-group { display: flex; align-items: center; gap: 14px; }
    .logo { font-size: 17px; font-weight: 800; letter-spacing: 6px; color: var(--gold); }
    .logo-sep { width: 1px; height: 14px; background: var(--gold-dim); }
    .collection-label { font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.45); }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .page-counter { font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,0.5); }

    /* Progress bar */
    .progress-bar {
      position: fixed; top: 52px; left: 0; height: 2px;
      background: linear-gradient(90deg, var(--gold), rgba(201,169,110,0.3));
      transition: width 0.35s ease; z-index: 70;
    }

    /* ── Viewer ── */
    .viewer {
      position: fixed; inset: 0;
      display: flex; align-items: stretch; justify-content: center;
      padding: 0 48px 72px; overflow: hidden;
    }
    .img-stage {
      position: relative;
      flex: 1;
      min-width: 0; min-height: 0;
      display: flex; align-items: stretch; justify-content: center;
    }
    .page-type-badge {
      font-size: 9px; letter-spacing: 2.5px; font-weight: 600; transition: color 0.3s;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .badge-dark  { color: rgba(201,169,110,0.85); }
    .badge-light { color: rgba(201,169,110,0.85); }

    /* ── Zoom Wrapper ── */
    #zoomWrapper {
      transform-origin: center center;
      flex: 1;
      min-width: 0; min-height: 0;
      display: flex; align-items: stretch; justify-content: center;
      will-change: transform;
    }

    /* ── Book Spread ── */
    .flip-stage {
      display: flex; align-items: stretch; justify-content: center;
      flex: 1;
      min-width: 0; min-height: 0;
    }

    /* 각 패널: grid로 under+over 겹치기 */
    .spread-left, .spread-right {
      flex: 1;
      min-width: 0; min-height: 0;
      display: grid;
      grid-template: 100% / 100%; /* 셀 크기를 컨테이너에 명시적으로 고정 */
      align-items: center;
      overflow: hidden;
    }
    .spread-left  { justify-items: end;   }
    .spread-right { justify-items: start; }

    .spread-left  > img,
    .spread-right > img {
      grid-area: 1 / 1;
      width: auto; height: auto;
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      border-radius: 2px; display: block;
    }

    /* z-order: over(현재)가 under(다음) 위에 */
    #imgLeftUnder  { z-index: 1; pointer-events: none; }
    #imgLeft       { z-index: 2; cursor: grab; }
    #imgRightUnder { z-index: 1; pointer-events: none; }
    #imgRight      { z-index: 2; cursor: grab; }

    /* 드래그 중 cursor */
    body.dragging #imgLeft,
    body.dragging #imgRight { cursor: grabbing; }

    /* 그림자 */
    #imgLeft       { box-shadow: -3px 0 20px rgba(0,0,0,0.6), 0 22px 64px rgba(0,0,0,0.72); }
    #imgRight      { box-shadow:  3px 0 20px rgba(0,0,0,0.6), 0 22px 64px rgba(0,0,0,0.72); }
    #imgLeftUnder,
    #imgRightUnder { box-shadow: 0 14px 44px rgba(0,0,0,0.5); }

    /* ── 버튼 클릭용 CSS 애니메이션 (드래그 경로와 별도) ── */
    @keyframes flipFwdAnim {
      0%   { transform: perspective(1500px) rotateY(0deg);    filter: brightness(1);    }
      35%  { transform: perspective(1500px) rotateY(-28deg);  filter: brightness(0.68); }
      100% { transform: perspective(1500px) rotateY(-90deg);  filter: brightness(0.10); }
    }
    @keyframes flipBwdAnim {
      0%   { transform: perspective(1500px) rotateY(0deg);   filter: brightness(1);    }
      35%  { transform: perspective(1500px) rotateY(28deg);  filter: brightness(0.68); }
      100% { transform: perspective(1500px) rotateY(90deg);  filter: brightness(0.10); }
    }

    #imgRight.btn-flip-fwd {
      animation: flipFwdAnim 0.42s ease-in forwards;
      transform-origin: 0% 50%;
    }
    #imgLeft.btn-flip-bwd {
      animation: flipBwdAnim 0.42s ease-in forwards;
      transform-origin: 100% 50%;
    }

    /* 책등 */
    .spread-spine {
      width: 4px; height: 72%; flex-shrink: 0;
      background: linear-gradient(to right,
        rgba(0,0,0,0.55) 0%,
        rgba(201,169,110,0.45) 40%, rgba(201,169,110,0.55) 50%,
        rgba(201,169,110,0.45) 60%, rgba(0,0,0,0.55) 100%
      );
      border-radius: 2px; box-shadow: 0 0 14px rgba(0,0,0,0.4);
    }

    /* ── Zoom UI ── */
    .zoom-hint {
      position: fixed; bottom: 56px; right: 20px;
      font-size: 9px; letter-spacing: 1.5px; color: rgba(255,255,255,0.25);
      pointer-events: none; z-index: 61; transition: opacity 0.3s;
    }
    .zoom-badge {
      position: fixed; top: 68px; right: 20px;
      font-size: 10px; letter-spacing: 1px; color: var(--gold);
      background: rgba(8,8,13,0.75); border: 1px solid var(--gold-dim);
      padding: 3px 10px; border-radius: 12px;
      z-index: 61; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }

    /* ── Nav Buttons ── */
    .nav-btn {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.55);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease; backdrop-filter: blur(6px); z-index: 60;
    }
    .nav-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); background: rgba(201,169,110,0.08); }
    .nav-btn:disabled { opacity: 0.15; cursor: default; }
    .nav-btn svg { width: 17px; height: 17px; stroke-width: 2; }
    #btnPrev { left: 14px; }
    #btnNext { right: 14px; }

    /* ── Chapter Bar ── */
    .chapter-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
      padding: 10px 36px 14px;
      background: linear-gradient(0deg, rgba(8,8,13,0.97) 65%, transparent);
      display: flex; justify-content: center; align-items: flex-end; gap: 2px;
      overflow-x: auto; scrollbar-width: none;
    }
    .chapter-bar::-webkit-scrollbar { display: none; }
    .ch-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 5px 11px; cursor: pointer; border-radius: 4px;
      opacity: 0.38; transition: opacity 0.2s, background 0.2s;
      min-width: 56px; flex-shrink: 0;
    }
    .ch-item:hover { opacity: 0.72; }
    .ch-item.active { opacity: 1; background: rgba(255,255,255,0.04); }
    .ch-num   { font-size: 8.5px; font-weight: 700; letter-spacing: 1.5px; color: var(--gold); }
    .ch-title { font-size: 7.5px; letter-spacing: 0.4px; color: rgba(255,255,255,0.65); white-space: nowrap; }
    .ch-dots  { display: flex; gap: 3px; margin-top: 1px; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background 0.25s; }
    .dot.on   { background: var(--gold); }
    .dot.past { background: rgba(201,169,110,0.35); }
    .ch-sep { width: 1px; height: 22px; background: rgba(255,255,255,0.07); align-self: center; flex-shrink: 0; }

    /* ── Header links ── */
    .cover-link {
      font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.82);
      text-decoration: none; border: 1px solid rgba(255,255,255,0.28);
      padding: 5px 14px; border-radius: 20px; transition: all 0.2s;
      text-shadow: 0 1px 4px rgba(0,0,0,0.55);
    }
    .cover-link:hover { color: var(--gold); border-color: var(--gold-dim); }

    /* ── Mode Toggle ── */
    .mode-toggle {
      display: flex; align-items: center;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 3px; gap: 2px;
    }
    .mt-btn {
      font-size: 9px; font-weight: 700; letter-spacing: 2.5px;
      padding: 4px 16px; border-radius: 16px; border: none;
      background: transparent; color: rgba(255,255,255,0.3);
      cursor: pointer; transition: all 0.25s ease;
    }
    .mt-btn.active-dark  { background: var(--gold); color: #08080d; }
    .mt-btn.active-light { background: rgba(210,230,240,0.9); color: #08080d; }

    /* ── Loading flash ── */
    .flash {
      position: fixed; inset: 0; background: var(--bg);
      z-index: 55; opacity: 0; pointer-events: none; transition: opacity 0.18s ease;
    }
    .flash.show { opacity: 1; pointer-events: all; }
  </style>
</head>
<body>

<div class="progress-bar" id="progressBar"></div>

<header>
  <div class="logo-group">
    <span class="logo">HANROOT</span>
    <span class="logo-sep"></span>
    <span class="collection-label">2026 COLLECTION</span>
    <span class="logo-sep"></span>
    <span class="page-type-badge" id="typeBadge"></span>
  </div>
  <div class="header-right">
    <span class="page-counter" id="pageCounter"></span>
    <a class="cover-link" href="models.html">모델 소개</a>
    <a class="cover-link" href="cover.html">표지 시안 →</a>
    <div class="mode-toggle">
      <button class="mt-btn active-dark" id="btnDark"  onclick="switchMode('dark')">DARK</button>
      <button class="mt-btn"             id="btnLight" onclick="switchMode('light')">LIGHT</button>
    </div>
  </div>
</header>

<div class="viewer">
  <div class="img-stage">
    <div id="zoomWrapper">
      <div class="flip-stage">
        <div class="spread-left">
          <img class="catalog-img" id="imgLeftUnder" src="" alt="" draggable="false">
          <img class="catalog-img" id="imgLeft"      src="" alt="" draggable="false">
        </div>
        <div class="spread-spine"></div>
        <div class="spread-right">
          <img class="catalog-img" id="imgRightUnder" src="" alt="" draggable="false">
          <img class="catalog-img" id="imgRight"      src="" alt="" draggable="false">
        </div>
      </div>
    </div>
  </div>
</div>

<button class="nav-btn" id="btnPrev" onclick="navigate(-1)" aria-label="이전">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"/></svg>
</button>
<button class="nav-btn" id="btnNext" onclick="navigate(1)" aria-label="다음">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
</button>

<div class="zoom-hint"  id="zoomHint">스크롤로 확대 · 드래그로 이동 · ESC 초기화</div>
<div class="zoom-badge" id="zoomBadge"></div>
<div class="flash"      id="flash"></div>
<nav class="chapter-bar" id="chapterBar"></nav>

<script>
  // ── Data ──────────────────────────────────────────────────────────────────
  const DARK   = 'images/dark/';
  const LIGHT  = 'images/light/';
  const DETAIL = 'images/detail/';

  const chapters = [
    { num:'01', title:'Security',      sub:'경비복·경찰복'      },
    { num:'02', title:'Tactical',      sub:'특수경비·흑복'      },
    { num:'03', title:'Business Wear', sub:'사무용 잠바·조끼'   },
    { num:'04', title:'Work Uniform',  sub:'산업용 작업복'      },
    { num:'05', title:'Outerwear',     sub:'항공·방한 잠바'     },
    { num:'06', title:'Pants',         sub:'바지 라인'          },
    { num:'07', title:'T-Shirts',      sub:'티셔츠'             },
    { num:'08', title:'Accessory',     sub:'모자·벨트·악세사리' },
  ];

  const SPREAD_COUNT = chapters.length;

  // ── Mode ──────────────────────────────────────────────────────────────────
  let mode = 'dark';
  const pages = [];

  function buildPages() {
    pages.length = 0;
    chapters.forEach((_, i) => {
      const f = `ch0${i + 1}.png`;
      pages.push({ src: (mode === 'dark' ? DARK : LIGHT) + f });
      pages.push({ src: DETAIL + f });
    });
  }

  function switchMode(m) {
    if (m === mode) return;
    mode = m;
    document.getElementById('btnDark').className  = 'mt-btn' + (mode === 'dark'  ? ' active-dark'  : '');
    document.getElementById('btnLight').className = 'mt-btn' + (mode === 'light' ? ' active-light' : '');
    buildPages();
    flashLoad(() => {
      elImgLeft.src  = pages[cur * 2].src;
      elImgRight.src = pages[cur * 2 + 1].src;
      setupUnders(); updateBadge();
    });
    pages.filter((_, i) => i % 2 === 0).forEach(p => preload(p.src));
  }

  // ── Preload ───────────────────────────────────────────────────────────────
  const imgCache = {};
  function preload(src) {
    if (src && !imgCache[src]) { const img = new Image(); img.src = src; imgCache[src] = img; }
  }
  function preloadAhead() {
    for (let d = -1; d <= 2; d++) {
      const s = cur + d;
      if (s >= 0 && s < SPREAD_COUNT) { preload(pages[s*2].src); preload(pages[s*2+1].src); }
    }
  }

  // ── DOM refs ──────────────────────────────────────────────────────────────
  let cur        = 0;
  let isFlipping = false;
  let firstLoad  = true;

  const elImgLeft       = document.getElementById('imgLeft');
  const elImgLeftUnder  = document.getElementById('imgLeftUnder');
  const elImgRight      = document.getElementById('imgRight');
  const elImgRightUnder = document.getElementById('imgRightUnder');
  const elCounter       = document.getElementById('pageCounter');
  const elBadge         = document.getElementById('typeBadge');
  const elPrev          = document.getElementById('btnPrev');
  const elNext          = document.getElementById('btnNext');
  const elProg          = document.getElementById('progressBar');
  const elFlash         = document.getElementById('flash');

  // ── Helpers ───────────────────────────────────────────────────────────────
  function updateUI() {
    elCounter.textContent = `CH ${cur + 1} / ${SPREAD_COUNT}`;
    elPrev.disabled       = cur === 0;
    elNext.disabled       = cur === SPREAD_COUNT - 1;
    elProg.style.width    = ((cur + 1) / SPREAD_COUNT * 100) + '%';
    updateBadge(); updateBar();
    elImgRight.style.cursor = cur < SPREAD_COUNT - 1 ? 'grab' : 'default';
    elImgLeft.style.cursor  = cur > 0               ? 'grab' : 'default';
  }

  function updateBadge() {
    const ch = chapters[cur];
    elBadge.textContent = `▪ CH.${ch.num}  ${ch.title}  ·  ${mode.toUpperCase()}`;
    elBadge.className   = `page-type-badge badge-${mode}`;
  }

  function flashLoad(fn) {
    elFlash.classList.add('show');
    setTimeout(() => {
      fn();
      let n = 0;
      const check = () => { if (++n >= 2) elFlash.classList.remove('show'); };
      elImgLeft.onload  = check; elImgLeft.onerror  = check;
      elImgRight.onload = check; elImgRight.onerror = check;
      if (elImgLeft.complete  && elImgLeft.naturalWidth  > 0) check();
      if (elImgRight.complete && elImgRight.naturalWidth > 0) check();
    }, 160);
  }

  function setupUnders() {
    const nxt = cur + 1, prv = cur - 1;
    elImgRightUnder.src = nxt < SPREAD_COUNT ? pages[nxt * 2 + 1].src : '';
    elImgLeftUnder.src  = prv >= 0           ? pages[prv * 2].src     : '';
  }

  // 반대쪽 페이지 조용히 교체 (짧은 fade)
  function swapOther(el, src, delay) {
    setTimeout(() => {
      el.style.transition = 'opacity 0.1s';
      el.style.opacity    = '0';
      setTimeout(() => {
        el.src            = src;
        el.style.opacity  = '1';
        setTimeout(() => { el.style.transition = ''; }, 130);
      }, 110);
    }, delay);
  }

  // CSS 클래스 애니메이션 완료 후 상태 정리
  function afterBtnFlip(dir) {
    const el = dir === 'fwd' ? elImgRight : elImgLeft;
    el.classList.remove(dir === 'fwd' ? 'btn-flip-fwd' : 'btn-flip-bwd');
    el.src = dir === 'fwd' ? pages[cur * 2 + 1].src : pages[cur * 2].src;
    setupUnders(); preloadAhead(); isFlipping = false;
  }

  // ── 버튼/챕터바 네비게이션 ────────────────────────────────────────────────
  function showSpread(idx) {
    const prev = cur;
    cur = Math.max(0, Math.min(idx, SPREAD_COUNT - 1));

    if (firstLoad || isFlipping || prev === cur) {
      firstLoad = false; isFlipping = false;
      elImgRight.classList.remove('btn-flip-fwd');
      elImgLeft.classList.remove('btn-flip-bwd');
      flashLoad(() => {
        elImgLeft.src  = pages[cur * 2].src;
        elImgRight.src = pages[cur * 2 + 1].src;
        setupUnders(); preloadAhead();
      });
      updateUI(); return;
    }

    updateUI();
    isFlipping = true;

    if (idx > prev) {
      elImgRight.classList.add('btn-flip-fwd');
      swapOther(elImgLeft, pages[cur * 2].src, 290);
      setTimeout(() => afterBtnFlip('fwd'), 450);
    } else {
      elImgLeft.classList.add('btn-flip-bwd');
      swapOther(elImgRight, pages[cur * 2 + 1].src, 290);
      setTimeout(() => afterBtnFlip('bwd'), 450);
    }
  }

  function navigate(dir) {
    const next = cur + dir;
    if (next >= 0 && next < SPREAD_COUNT) showSpread(next);
  }

  // ── Chapter Bar ───────────────────────────────────────────────────────────
  function buildBar() {
    const bar = document.getElementById('chapterBar');
    chapters.forEach((ch, i) => {
      if (i > 0) { const s = document.createElement('div'); s.className = 'ch-sep'; bar.appendChild(s); }
      const item = document.createElement('div');
      item.className = 'ch-item'; item.id = `chi-${i}`;
      item.innerHTML = `<span class="ch-num">CH.${ch.num}</span>
        <span class="ch-title">${ch.title}</span>
        <div class="ch-dots"><div class="dot" id="d${i}"></div></div>`;
      item.onclick = () => showSpread(i);
      bar.appendChild(item);
    });
  }

  function updateBar() {
    chapters.forEach((_, i) => {
      document.getElementById(`chi-${i}`).classList.toggle('active', i === cur);
      const d = document.getElementById(`d${i}`);
      d.className = 'dot' + (i === cur ? ' on' : i < cur ? ' past' : '');
    });
  }

  // ── Keyboard & Touch ──────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { resetZoom(); return; }
    if (zoom > 1) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigate(-1);
    if (e.key === 'Home') showSpread(0);
    if (e.key === 'End')  showSpread(SPREAD_COUNT - 1);
  });

  // ─────────────────────────────────────────────────────────────────────────
  // ── 드래그로 책장 넘기기 ─────────────────────────────────────────────────
  // ─────────────────────────────────────────────────────────────────────────

  let drag = null; // 진행 중인 드래그 상태

  function pointerX(e)     { return e.touches        ? e.touches[0].clientX        : e.clientX; }
  function pointerEndX(e)  { return e.changedTouches ? e.changedTouches[0].clientX : e.clientX; }

  function initDrag(e, dir) {
    if (isFlipping) return;
    if (dir === 'fwd' && cur >= SPREAD_COUNT - 1) return;
    if (dir === 'bwd' && cur <= 0) return;

    // under 레이어 즉시 준비
    if (dir === 'fwd') {
      const src = pages[(cur + 1) * 2 + 1].src;
      preload(src); elImgRightUnder.src = src;
    } else {
      const src = pages[(cur - 1) * 2].src;
      preload(src); elImgLeftUnder.src = src;
    }

    const el     = dir === 'fwd' ? elImgRight : elImgLeft;
    const panel  = el.closest(dir === 'fwd' ? '.spread-right' : '.spread-left');

    el.style.transition    = 'none';
    el.style.transformOrigin = dir === 'fwd' ? '0% 50%' : '100% 50%';

    drag = { dir, el, startX: pointerX(e), startTime: Date.now(), angle: 0, panelW: panel.offsetWidth };

    document.body.classList.add('dragging');
    document.addEventListener('mousemove', onDragMove, false);
    document.addEventListener('mouseup',   onDragEnd,  false);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend',  onDragEnd,  false);
    e.preventDefault();
  }

  function onDragMove(e) {
    if (!drag) return;
    e.preventDefault();

    const dx       = drag.startX - pointerX(e);   // 왼쪽으로 끌면 양수
    const ratio    = dx / (drag.panelW * 0.68);   // 68% 이동 = 90°
    const raw      = -ratio * 90;                  // 음수가 앞으로(fwd)
    drag.angle = drag.dir === 'fwd'
      ? Math.max(-90, Math.min(0, raw))            // [−90 ~ 0]
      : Math.min( 90, Math.max(0, raw));           // [0 ~ +90] (뒤로는 오른쪽 드래그)

    const t = Math.abs(drag.angle) / 90;
    drag.el.style.transform = `perspective(1500px) rotateY(${drag.angle}deg)`;
    drag.el.style.filter    = `brightness(${1 - t * 0.9})`;
  }

  function onDragEnd(e) {
    if (!drag) return;

    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup',   onDragEnd);
    document.removeEventListener('touchmove', onDragMove);
    document.removeEventListener('touchend',  onDragEnd);
    document.body.classList.remove('dragging');

    const { dir, el, startX, startTime, angle } = drag;
    drag = null;

    const moved   = Math.abs(pointerEndX(e) - startX);
    const elapsed = Date.now() - startTime;

    // ── 클릭 판정: 거의 안 움직였으면 → 버튼 클릭과 동일 ──
    if (moved < 8 && elapsed < 300) {
      el.style.transition     = '';
      el.style.transform      = '';
      el.style.filter         = '';
      el.style.transformOrigin = '';
      navigate(dir === 'fwd' ? 1 : -1);
      return;
    }

    // ── 절반 넘었으면 → 완성, 아니면 → 스냅백 ──
    const pastHalf = dir === 'fwd' ? angle < -45 : angle > 45;
    if (pastHalf) dragComplete(dir, el, angle);
    else          dragSnapBack(el, angle);
  }

  // 드래그 → 넘기기 완성
  function dragComplete(dir, el, fromAngle) {
    const target   = dir === 'fwd' ? -90 : 90;
    const remaining = Math.abs(target - fromAngle);
    const dur      = Math.max(60, (remaining / 90) * 300); // 남은 각도에 비례한 속도

    isFlipping = true;
    el.style.transition = `transform ${dur}ms ease-in, filter ${dur}ms ease-in`;
    el.style.transform  = `perspective(1500px) rotateY(${target}deg)`;
    el.style.filter     = 'brightness(0.10)';

    const nextCur = Math.max(0, Math.min(cur + (dir === 'fwd' ? 1 : -1), SPREAD_COUNT - 1));

    setTimeout(() => {
      cur = nextCur;
      updateUI();

      // 넘어간 페이지: invisible(-90°) 상태에서 src 교체 → 0°로 순간 복귀 (깜빡임 없음)
      el.style.transition     = 'none';
      el.style.transform      = '';
      el.style.filter         = '';
      el.style.transformOrigin = '';
      el.src = dir === 'fwd' ? pages[cur * 2 + 1].src : pages[cur * 2].src;

      // 반대쪽 페이지 조용히 교체
      const other    = dir === 'fwd' ? elImgLeft  : elImgRight;
      const otherSrc = dir === 'fwd' ? pages[cur * 2].src : pages[cur * 2 + 1].src;
      other.style.transition = 'opacity 0.1s';
      other.style.opacity    = '0';
      setTimeout(() => {
        other.src            = otherSrc;
        other.style.opacity  = '1';
        setTimeout(() => { other.style.transition = ''; }, 130);
      }, 100);

      setupUnders(); preloadAhead();
      isFlipping = false;
    }, dur + 20);
  }

  // 드래그 → 스냅백 (절반 미만에서 놓기)
  function dragSnapBack(el, fromAngle) {
    const dur = Math.max(160, (Math.abs(fromAngle) / 90) * 400);
    // 용수철 easing: 살짝 오버슈팅 후 정착
    el.style.transition = `transform ${dur}ms cubic-bezier(0.34, 1.56, 0.64, 1), filter ${dur}ms ease`;
    el.style.transform  = 'perspective(1500px) rotateY(0deg)';
    el.style.filter     = 'brightness(1)';

    setTimeout(() => {
      el.style.transition     = '';
      el.style.transform      = '';
      el.style.filter         = '';
      el.style.transformOrigin = '';
    }, dur + 60);
  }

  // 이벤트 연결
  elImgRight.addEventListener('mousedown',  e => initDrag(e, 'fwd'), false);
  elImgRight.addEventListener('touchstart', e => initDrag(e, 'fwd'), { passive: false });
  elImgLeft.addEventListener('mousedown',   e => initDrag(e, 'bwd'), false);
  elImgLeft.addEventListener('touchstart',  e => initDrag(e, 'bwd'), { passive: false });

  // 스와이프 (드래그가 아닌 영역에서 터치로 넘기기)
  let tx = 0;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (drag) return; // 드래그 중이면 무시
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 60) navigate(dx < 0 ? 1 : -1);
  });

  // ── Zoom & Pan ────────────────────────────────────────────────────────────
  let zoom = 1, panX = 0, panY = 0;
  const elZoom      = document.getElementById('zoomWrapper');
  const elZoomBadge = document.getElementById('zoomBadge');
  const elZoomHint  = document.getElementById('zoomHint');
  let zoomTimer = null;

  function applyTransform() {
    elZoom.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    elZoom.style.cursor    = zoom > 1 ? 'grab' : 'default';
  }
  function showZoomBadge() {
    if (zoom <= 1) { elZoomBadge.style.opacity = '0'; return; }
    elZoomBadge.textContent  = `× ${zoom.toFixed(1)}`;
    elZoomBadge.style.opacity = '1';
    clearTimeout(zoomTimer);
    zoomTimer = setTimeout(() => { elZoomBadge.style.opacity = '0'; }, 1200);
  }
  function resetZoom() {
    zoom = 1; panX = 0; panY = 0;
    applyTransform(); elZoomBadge.style.opacity = '0';
  }

  document.querySelector('.viewer').addEventListener('wheel', e => {
    if (drag) return; // 드래그 중엔 줌 무시
    e.preventDefault();
    zoom = Math.min(6, Math.max(1, zoom * (e.deltaY < 0 ? 1.12 : 0.89)));
    if (zoom <= 1.05) { zoom = 1; panX = 0; panY = 0; }
    applyTransform(); showZoomBadge();
    elZoomHint.style.opacity = zoom > 1 ? '0' : '0.6';
  }, { passive: false });

  let panning = false, panSX = 0, panSY = 0;
  elZoom.addEventListener('mousedown', e => {
    if (zoom <= 1 || drag) return;
    panning = true; panSX = e.clientX - panX; panSY = e.clientY - panY;
    elZoom.style.cursor = 'grabbing'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!panning) return;
    panX = e.clientX - panSX; panY = e.clientY - panSY; applyTransform();
  });
  document.addEventListener('mouseup', () => {
    if (!panning) return;
    panning = false; elZoom.style.cursor = zoom > 1 ? 'grab' : 'default';
  });
  elZoom.addEventListener('dblclick', resetZoom);

  // ── Init ──────────────────────────────────────────────────────────────────
  buildPages(); buildBar(); showSpread(0);
  pages.slice(0, 6).forEach(p => preload(p.src));
  setTimeout(() => { elZoomHint.style.opacity = '0.5'; }, 800);
</script>
</body>
</html>
