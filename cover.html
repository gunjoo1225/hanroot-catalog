<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HANROOT 2026 — 표지 시안</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #c9a96e;
      --gold-dim: rgba(201,169,110,0.35);
      --bg: #07070c;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Helvetica Neue', 'Apple SD Gothic Neo', Arial, sans-serif;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0; z-index: 60;
      height: 52px;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      background: rgba(7,7,12,0.52);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .header-inner {
      width: 100%; max-width: 1200px;
      margin: 0 auto; padding: 0 56px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo-group { display: flex; align-items: center; gap: 14px; }
    .logo  { font-size: 17px; font-weight: 800; letter-spacing: 6px; color: var(--gold); }
    .sep   { width: 1px; height: 14px; background: var(--gold-dim); }
    .hd-sub { font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.45); }

    .header-right { display: flex; align-items: center; gap: 16px; }

    .catalog-link {
      font-size: 10px; letter-spacing: 2px;
      color: rgba(255,255,255,0.3); text-decoration: none;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 5px 14px; border-radius: 20px;
      transition: all 0.2s;
    }
    .catalog-link:hover { color: var(--gold); border-color: var(--gold-dim); }

    /* ── Mode Toggle ── */
    .mode-toggle {
      display: flex; align-items: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 3px; gap: 2px;
    }
    .mt-btn {
      font-size: 9px; font-weight: 700; letter-spacing: 2.5px;
      padding: 4px 16px; border-radius: 16px;
      border: none; background: transparent;
      color: rgba(255,255,255,0.3);
      cursor: pointer; transition: all 0.25s ease;
    }
    .mt-btn.active-dark  { background: var(--gold); color: #07070c; }
    .mt-btn.active-light { background: rgba(210,230,240,0.9); color: #07070c; }

    /* ── Stage ── */
    .stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 54px 70px 116px;
      gap: 24px;
    }

    .img-slot {
      position: relative; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      /* 슬롯이 이미지 자연 너비만큼만 차지하게: 성장 안 함, 넘칠 때만 수축 */
      flex: 0 1 auto;
      min-width: 0;
    }
    .img-slot.hidden { display: none; }

    .slot-label {
      font-size: 9px; letter-spacing: 3px;
      color: rgba(255,255,255,0.25);
      margin-bottom: 10px; height: 14px;
      flex-shrink: 0;
    }

    .cover-img {
      /* 높이는 슬롯 전체 채움(레이블 제외), 너비는 비율에 따라 자동 결정 */
      display: block;
      height: calc(100% - 24px);
      width: auto;
      max-height: calc(100% - 24px);
      max-width: 100%;
      object-fit: contain; border-radius: 3px;
      box-shadow: 0 28px 80px rgba(0,0,0,0.8), 0 8px 24px rgba(0,0,0,0.45);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* ── Zoom ── */
    .stage { overflow: hidden; }

    .zoom-hint {
      position: fixed;
      bottom: 56px; right: 20px;
      font-size: 9px; letter-spacing: 1.5px;
      color: rgba(255,255,255,0.25);
      pointer-events: none; z-index: 61;
      transition: opacity 0.3s;
    }

    .zoom-badge {
      position: fixed;
      top: 68px; right: 20px;
      font-size: 10px; letter-spacing: 1px;
      color: var(--gold);
      background: rgba(7,7,12,0.75);
      border: 1px solid var(--gold-dim);
      padding: 3px 10px; border-radius: 12px;
      z-index: 61; opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    /* ── Flash ── */
    .flash {
      position: fixed; inset: 0; background: var(--bg);
      z-index: 55; opacity: 0; pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .flash.show { opacity: 1; pointer-events: all; }

    /* ── Nav arrows ── */
    .nav-btn {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.4); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; z-index: 60; backdrop-filter: blur(6px);
    }
    .nav-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); background: rgba(201,169,110,0.08); }
    .nav-btn:disabled { opacity: 0.12; cursor: default; }
    .nav-btn svg { width: 16px; height: 16px; stroke-width: 2; }
    #btnPrev { left: 14px; }
    #btnNext { right: 14px; }

    /* ── Bottom bar ── */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
      background: linear-gradient(0deg, rgba(7,7,12,0.98) 70%, transparent);
      padding: 6px 36px 16px;
    }

    /* Front/Back toggle */
    .vt-wrap { display: flex; justify-content: center; margin-bottom: 8px; }
    .view-toggle { display: flex; gap: 4px; }
    .vt-btn {
      font-size: 9px; letter-spacing: 2px;
      padding: 4px 16px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: rgba(255,255,255,0.3);
      cursor: pointer; transition: all 0.2s;
    }
    .vt-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,169,110,0.08); }
    .vt-btn:hover:not(.active) { border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.6); }

    /* Option tabs */
    .tabs { display: flex; justify-content: center; gap: 5px; margin-bottom: 8px; }

    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 7px 16px; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; cursor: pointer; transition: all 0.2s;
      min-width: 84px; background: rgba(255,255,255,0.02);
    }
    .tab:hover { border-color: var(--gold-dim); background: rgba(201,169,110,0.05); }
    .tab.active { border-color: var(--gold); background: rgba(201,169,110,0.1); }

    .tab-label { font-size: 9px; font-weight: 700; letter-spacing: 2.5px; color: var(--gold); opacity: 0.55; transition: opacity 0.2s; }
    .tab.active .tab-label { opacity: 1; }
    .tab-name  { font-size: 8.5px; letter-spacing: 0.4px; color: rgba(255,255,255,0.4); white-space: nowrap; transition: color 0.2s; }
    .tab.active .tab-name { color: rgba(255,255,255,0.8); }

    /* Desc */
    .concept-desc { text-align: center; font-size: 10px; letter-spacing: 1.5px; color: rgba(255,255,255,0.22); height: 16px; }
  </style>
</head>
<body>

<div class="zoom-hint" id="zoomHint">스크롤로 확대 · 드래그로 이동 · ESC 초기화</div>
<div class="zoom-badge" id="zoomBadge"></div>
<div class="flash" id="flash"></div>

<header>
  <div class="header-inner">
    <div class="logo-group">
      <span class="logo">HANROOT</span>
      <span class="sep"></span>
      <span class="hd-sub">2026 표지 시안</span>
    </div>
    <div class="header-right">
      <a class="catalog-link" href="models.html">모델 소개</a>
      <a class="catalog-link" href="index.html">카탈로그 보기 →</a>
      <div class="mode-toggle">
        <button class="mt-btn active-dark" id="btnDark"  onclick="switchMode('dark')">DARK</button>
        <button class="mt-btn"             id="btnLight" onclick="switchMode('light')">LIGHT</button>
      </div>
    </div>
  </div>
</header>

<div class="stage" id="stage">
  <div class="img-slot" id="slotFront">
    <div class="slot-label" id="labelFront"></div>
    <img class="cover-img" id="imgFront" src="" alt="" draggable="false">
  </div>
  <div class="img-slot hidden" id="slotBack">
    <div class="slot-label" id="labelBack">뒤표지</div>
    <img class="cover-img" id="imgBack" src="" alt="" draggable="false">
  </div>
</div>

<button class="nav-btn" id="btnPrev" onclick="move(-1)" aria-label="이전">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"/></svg>
</button>
<button class="nav-btn" id="btnNext" onclick="move(1)" aria-label="다음">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
</button>

<div class="bottom-bar">
  <div class="vt-wrap">
    <div class="view-toggle" id="viewToggle" style="display:none;">
      <button class="vt-btn active" id="vFront" onclick="setView('front')">앞표지</button>
      <button class="vt-btn"        id="vBoth"  onclick="setView('both')">앞 + 뒤</button>
      <button class="vt-btn"        id="vBack"  onclick="setView('back')">뒤표지</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="concept-desc" id="conceptDesc"></div>
</div>

<script>
  // ── Concept definitions ────────────────────────────────────────────────────
  const concepts = [
    {
      label: 'SPREAD',
      name:  '전체 스프레드',
      desc:  '앞표지 · 등 · 뒤표지 전체 레이아웃',
      dark:  { front: 'images/cover/spread.png',   back: null },
      light: { front: 'images/cover/spread.png',   back: null }, // spread은 공통
    },
    {
      label: 'OPTION A',
      name:  'Hero Portrait',
      desc:  '인물 클로즈업 · 권위감 · 전문성 강조',
      dark:  { front: 'images/cover/option-a.png', back: 'images/cover/back-a.png' },
      light: { front: 'images/cover/light-option-a.png', back: 'images/cover/light-back-a.png' },
    },
    {
      label: 'OPTION B',
      name:  'Environment',
      desc:  '건물 배경 · 현장감 · 브랜드 스케일 표현',
      dark:  { front: 'images/cover/option-b.png', back: 'images/cover/back-b.png' },
      light: { front: 'images/cover/light-option-b.png', back: 'images/cover/light-back-b.png' },
    },
    {
      label: 'OPTION C',
      name:  'Typographic',
      desc:  '타이포 중심 · 미니멀 · 럭셔리 감성',
      dark:  { front: 'images/cover/option-c.png', back: 'images/cover/back-c.png' },
      light: { front: 'images/cover/light-option-c.png', back: 'images/cover/light-back-c.png' },
    },
    {
      label: 'OPTION D',
      name:  'Material',
      desc:  '소재 디테일 · 품질 강조 · 장인 정신',
      dark:  { front: 'images/cover/option-d.png', back: 'images/cover/back-d.png' },
      light: { front: 'images/cover/light-option-d.png', back: 'images/cover/light-back-d.png' },
    },
  ];

  // Preload all images
  concepts.forEach(c => {
    ['dark','light'].forEach(m => {
      [c[m].front, c[m].back].filter(Boolean).forEach(src => { new Image().src = src; });
    });
  });

  // ── State ─────────────────────────────────────────────────────────────────
  let mode = 'dark';   // 'dark' | 'light'
  let cur  = 1;        // concept index (start on Option A)
  let view = 'front';  // 'front' | 'both' | 'back'

  const elFlash  = document.getElementById('flash');
  const elFront  = document.getElementById('imgFront');
  const elBack   = document.getElementById('imgBack');
  const elSlotF  = document.getElementById('slotFront');
  const elSlotB  = document.getElementById('slotBack');
  const elLabelF = document.getElementById('labelFront');
  const elToggle = document.getElementById('viewToggle');
  const elDesc   = document.getElementById('conceptDesc');
  const btnPrev  = document.getElementById('btnPrev');
  const btnNext  = document.getElementById('btnNext');

  // ── Mode switch ───────────────────────────────────────────────────────────
  function switchMode(newMode) {
    if (newMode === mode) return;
    mode = newMode;
    document.getElementById('btnDark').className  = 'mt-btn' + (mode === 'dark'  ? ' active-dark'  : '');
    document.getElementById('btnLight').className = 'mt-btn' + (mode === 'light' ? ' active-light' : '');
    render(false); // swap images without re-flashing the tab state
  }

  // ── View (front/both/back) ────────────────────────────────────────────────
  function setView(v) {
    view = v;
    ['front','both','back'].forEach(k => {
      document.getElementById('v' + k.charAt(0).toUpperCase() + k.slice(1))
        .classList.toggle('active', k === v);
    });
    applySlots();
  }

  function applySlots() {
    const hasBack = !!concepts[cur][mode].back;
    if (!hasBack || view === 'front') {
      elSlotF.classList.remove('hidden'); elSlotB.classList.add('hidden');
      elLabelF.textContent = '';
    } else if (view === 'back') {
      elSlotF.classList.add('hidden'); elSlotB.classList.remove('hidden');
    } else {
      elSlotF.classList.remove('hidden'); elSlotB.classList.remove('hidden');
      elLabelF.textContent = '앞표지';
    }
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function render(doFlash = true) {
    const c    = concepts[cur];
    const imgs = c[mode];

    if (doFlash) elFlash.classList.add('show');

    const apply = () => {
      elFront.src = imgs.front;
      if (imgs.back) elBack.src = imgs.back;

      const hasBack = !!imgs.back;
      elToggle.style.display = hasBack ? 'flex' : 'none';
      if (!hasBack) view = 'front';
      applySlots();

      elDesc.textContent = c.desc;
      btnPrev.disabled = cur === 0;
      btnNext.disabled = cur === concepts.length - 1;

      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === cur));

      elFront.onload = () => { if (doFlash) elFlash.classList.remove('show'); };
      elFront.onerror = () => { if (doFlash) elFlash.classList.remove('show'); };
    };

    if (doFlash) setTimeout(apply, 160);
    else apply();
  }

  function show(idx) { cur = Math.max(0, Math.min(idx, concepts.length - 1)); resetZoom(); render(true); }
  function move(dir) { show(cur + dir); }

  // ── Tabs ──────────────────────────────────────────────────────────────────
  function buildTabs() {
    const container = document.getElementById('tabs');
    concepts.forEach((c, i) => {
      const tab = document.createElement('div');
      tab.className = 'tab';
      tab.innerHTML = `<span class="tab-label">${c.label}</span><span class="tab-name">${c.name}</span>`;
      tab.onclick = () => show(i);
      container.appendChild(tab);
    });
  }

  // ── Zoom & Pan ────────────────────────────────────────────────────────────
  let zoom = 1, panX = 0, panY = 0;
  const elStage     = document.getElementById('stage');
  const elZoomBadge = document.getElementById('zoomBadge');
  const elZoomHint  = document.getElementById('zoomHint');
  let zoomBadgeTimer = null;

  function applyTransform() {
    elStage.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    elStage.style.transformOrigin = 'center center';
    elStage.style.cursor = zoom > 1 ? 'grab' : 'default';
  }

  function showZoomBadge() {
    if (zoom <= 1) { elZoomBadge.style.opacity = '0'; return; }
    elZoomBadge.textContent = `× ${zoom.toFixed(1)}`;
    elZoomBadge.style.opacity = '1';
    clearTimeout(zoomBadgeTimer);
    zoomBadgeTimer = setTimeout(() => { elZoomBadge.style.opacity = '0'; }, 1200);
  }

  function resetZoom() {
    zoom = 1; panX = 0; panY = 0;
    applyTransform();
    elZoomBadge.style.opacity = '0';
  }

  document.querySelector('.stage').addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    zoom = Math.min(6, Math.max(1, zoom * factor));
    if (zoom <= 1.05) { zoom = 1; panX = 0; panY = 0; }
    applyTransform();
    showZoomBadge();
    elZoomHint.style.opacity = zoom > 1 ? '0' : '0.6';
  }, { passive: false });

  let dragging = false, dragStartX = 0, dragStartY = 0;
  elStage.addEventListener('mousedown', e => {
    if (zoom <= 1) return;
    dragging = true;
    dragStartX = e.clientX - panX;
    dragStartY = e.clientY - panY;
    elStage.style.cursor = 'grabbing';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    panX = e.clientX - dragStartX;
    panY = e.clientY - dragStartY;
    applyTransform();
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    elStage.style.cursor = zoom > 1 ? 'grab' : 'default';
  });
  elStage.addEventListener('dblclick', resetZoom);

  // ── Keyboard & Touch ──────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { resetZoom(); return; }
    if (zoom > 1) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') move(1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   move(-1);
    if (e.key === 'd' || e.key === 'D') switchMode('dark');
    if (e.key === 'l' || e.key === 'L') switchMode('light');
    if (e.key === '1') setView('front');
    if (e.key === '2') setView('both');
    if (e.key === '3') setView('back');
  });

  let tx = 0;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 48) move(dx < 0 ? 1 : -1);
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  buildTabs();
  show(1);
  setTimeout(() => { elZoomHint.style.opacity = '0.5'; }, 800);
</script>
</body>
</html>
